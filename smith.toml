#:schema https://raw.githubusercontent.com/monosmith-app/monosmith/main/apps/smith/workspace/smith.schema.json
# smith workspace configuration. Written by `smith convert`; edit it freely or with the TUI.
# Every setting is optional except [workspace] name; see https://github.com/monosmith-app/monosmith/blob/main/docs/reference/configuration.md.
schema = 1

[workspace]
name = "monosmith"
scope = "@monosmith"
module_prefix = "github.com/monosmith-app/monosmith"
# Example plugins in the documentation are standalone modules, not projects.
exclude = ["docs/examples/**", "apps/smith/goldenpath/testdata/**"]

[ci]
providers = ["github"]

# Every Go project gets a slice-check task, run before lint: role-named files,
# no junk-drawer folders (see docs/reference/conventions.md).
[conventions.vertical-slices]

[tasks.lint]
command = ["golangci-lint", "run", "--allow-serial-runners"]

[release]
github_releases = true
# VS Code extensions publish as a Microsoft Entra ID app signed in with the workflow
# (federated credential), not with a VSCE_PAT secret: see docs/reference/releasing.md.
vsce_entra = true

[projects.smith.release]
asset_name = "{product}_{version}_{os}_{arch}.{ext}"
product = "monosmith"
# Attached to each GitHub Release, ready for a tap, a bucket and winget-pkgs.
package_managers = ["homebrew", "scoop", "winget"]
# Also attached: sudo apt install ./monosmith_<v>_amd64.deb, or dnf with the .rpm.
linux_packages = ["deb", "rpm"]
# Published from the same archives, each installing the smith command:
# npm i -g monosmith, pipx install monosmith / uvx --from monosmith smith, and
# dotnet tool install -g monosmith, and gem install monosmith.
npm = ["@monosmith/cli", "monosmith"]
pypi = "monosmith"
nuget = "monosmith"
rubygems = "monosmith"
# dart pub global activate monosmith: the release tags smith-v<version> and
# starts .github/workflows/pub.yml on it, which pub.dev's automated
# publishing accepts.
pub = "monosmith"
description = "Runs a monorepo in Node, Go, Python, Rust, .NET, Ruby, PHP, C++, Dart, the JVM and Bicep: tasks from a cache, CI and releases"
license = "MIT"

# The workspace's lint above is golangci-lint, for the Go projects; this Node
# package lints with its own ESLint script.
[projects.eslint-config.tasks.lint]
command = ["npm", "run", "lint", "--silent"]

# The extension is an app: it is versioned by its tag, and the vscode plugin
# packs it into a .vsix and publishes it to the Marketplace (and Open VSX).
[projects.vscode.release]

[projects.vscode.tasks.lint]
command = ["npm", "run", "lint", "--silent"]

[projects.smith.tasks.build-dev]
command = ["go", "build", "-gcflags=all=-N -l", "-o", "../../dist/dev/apps/smith/smith", "."]
outputs = ["../../dist/dev/apps/smith"]

[projects.smith.tasks.dev]
command = ["go", "run", "github.com/air-verse/air@v1.61.7", "--build.cmd", "go build ./...", "--build.bin", "go run .", "--build.exclude_dir", "tmp"]

[projects.smith.tasks.start]
command = ["go", "run", "."]

# Regenerates schema/protocol.schema.json from the Go types of the protocol (the
# source of truth for the plugin SDKs of other languages). A Go test fails when
# the committed file is stale; plugin-sdk-ts then regenerates its types (smith
# run generate --project plugin-sdk-ts).
[projects.plugin-sdk.tasks.schema]
command = ["go", "run", "./schemagen"]

# The SDK for plugins in TypeScript lints with ESLint like the other Node package; the
# workspace-wide lint above is golangci-lint, for the Go projects.
[projects.plugin-sdk-ts.tasks.lint]
command = ["npm", "run", "lint", "--silent"]

# The SDK for plugins in Python lints with ruff, from the workspace's .venv. The venv's
# interpreter is .venv/Scripts/python.exe on Windows and .venv/bin/python elsewhere, and a
# command here cannot be both, so tools/run_in_venv hands over to whichever exists.
[projects.plugin-sdk-py.tasks.lint]
command = ["python", "-m", "tools.run_in_venv.run_in_venv_handler", "-m", "ruff", "check", "."]

# Regenerates the protocol types from the schema (after `smith run schema -p plugin-sdk`);
# generate-check fails when they are stale (a test of the package does too).
[projects.plugin-sdk-py.tasks.generate]
command = ["python", "-m", "tools.run_in_venv.run_in_venv_handler", "-m", "tools.generate_protocol.generate_protocol_handler"]

[projects.plugin-sdk-py.tasks.generate-check]
command = ["python", "-m", "tools.run_in_venv.run_in_venv_handler", "-m", "tools.generate_protocol.generate_protocol_handler", "--check"]
