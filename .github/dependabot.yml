# Weekly dependency-update PRs so vulnerable or stale dependencies surface as a
# reviewable PR instead of only a push-time warning.
#
# Written by the old mnci when this repository was bootstrapped. smith does not
# generate this file: it is maintained by hand.
#
# pip and pub appear here only once the workspace HAS a Python or Dart project.
# An ecosystem entry whose directories match no manifest is a hard Dependabot
# failure, not a no-op, so emitting them unconditionally cost every workspace
# two red runs a week over projects it does not have.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # The Nx packages are pinned to one exact version and must move together: a PR for one alone fails resolution
    # (ERESOLVE between @nx/eslint and @nx/jest) or leaves a second copy of nx in the lockfile (#295).
    groups:
      nx:
        patterns:
          - "nx"
          - "@nx/*"
    ignore:
      # The types follow the Node version the code runs on (CI and the templates use 24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Babel presets need @babel/core 8, but babel-jest 30 needs @babel/core 7: stay on 7 until babel-jest supports 8.
      - dependency-name: "@babel/preset-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # ci.yml and pub.yml are generated by smith from the versions pinned in its own code, so a bump made
    # by hand there fails `smith ci generate --check` and is undone by the next regeneration. These actions
    # move with a smith release instead (and golden-path.yml, which is written by hand, is bumped in the
    # same change).
    ignore:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/setup-go"
      - dependency-name: "actions/setup-node"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "dart-lang/setup-dart"
