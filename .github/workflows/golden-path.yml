# The smith Go modules on every OS, and the golden path end to end. Hand-written
# (not generated by the overlay), so `smith upgrade` leaves it alone.
#
# Pull requests and pushes run the unit job only (minutes). The golden path
# suites take up to 45 minutes on Windows, so they run once a day and on
# demand (Actions, golden-path, Run workflow); convert runs on demand only.
name: golden-path

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: golden-path-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - name: Vet and test every module
        shell: bash
        run: |
          set -e
          # Every module go.work uses, so a new plugin is tested without
          # listing it here.
          for m in $(go work edit -json | sed -n 's/.*"DiskPath": "\.\/\(.*\)".*/\1/p'); do
            echo "::group::$m"
            (cd "$m" && go vet ./... && go test -race=false ./...)
            echo "::endgroup::"
          done

  # Two suites in parallel, each well inside its timeout: the golden path
  # itself, and every language's workspace.
  golden-path:
    name: golden path (${{ matrix.suite }}, ${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        suite: [core, languages]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The jvm plugin's kotlin stack's e2e. First: where a Gradle is already
      # on PATH (/usr/bin on Ubuntu) setup-gradle puts that directory first,
      # and every later setup step must still win over it (setup-ruby).
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The dotnet plugin's e2e builds for .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The ruby plugin's e2e.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # The php plugin's e2e.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      # The cpp plugin's e2e, on Linux (CMake and g++ are on the image).
      - name: Install Ninja and cppcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build cppcheck
      # The dart plugin's e2e builds a Flutter web app; Flutter carries Dart.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The jvm plugin's e2e; the hosted images carry Maven.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: New workspace, every kind in every language, build, test, release
        working-directory: apps/smith
        shell: bash
        env:
          SUITE: ${{ matrix.suite == 'core' && '-run=^TestGoldenPath$' || '-skip=^(TestConvert.*|TestGoldenPath)$' }}
        run: go test -tags e2e -timeout 40m -v "$SUITE" ./goldenpath

  # Manual only: building the old-mnci and Nx workspaces to convert (the
  # Turborepo one is a committed fixture) takes
  # over half an hour on Windows, and nobody else converts yet. Run it from
  # the Actions tab after changing convert.
  convert:
    name: convert (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Convert an Nx, an old-mnci and a Turborepo workspace, then build and plan a release
        working-directory: apps/smith
        run: go test -tags e2e -timeout 85m -v -run TestConvert ./goldenpath
