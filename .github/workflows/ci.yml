# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache the go download store
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: smith-go-${{ runner.os }}-${{ hashFiles('libs/actions/go.sum', 'libs/plugin-architectures/go.sum', 'libs/plugin-bicep/go.sum', 'libs/plugin-cpp/go.sum', 'libs/plugin-dart/go.sum', 'libs/plugin-docker/go.sum', 'libs/plugin-dotnet/go.sum', 'libs/plugin-go/go.sum', 'libs/plugin-jvm/go.sum', 'libs/plugin-node/go.sum', 'libs/plugin-node-toolchains/go.sum', 'libs/plugin-php/go.sum', 'libs/plugin-python/go.sum', 'libs/plugin-recipe/go.sum', 'libs/plugin-ruby/go.sum', 'libs/plugin-rust/go.sum', 'packages/plugin-sdk/go.sum', 'libs/plugin-vertical-slices/go.sum', 'apps/smith/go.sum') }}
          restore-keys: |
            smith-go-${{ runner.os }}-
      - name: Cache the npm download store
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: smith-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            smith-npm-${{ runner.os }}-
      - name: Cache the nuget download store
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: smith-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj') }}
          restore-keys: |
            smith-nuget-${{ runner.os }}-
      - name: Cache the pip download store
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: smith-pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'packages/plugin-sdk-py/pyproject.toml') }}
          restore-keys: |
            smith-pip-${{ runner.os }}-
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith
          smith --version
      # smith:slot before-setup
      # This repository is smith: every step below runs the smith built from this commit.
      - name: Build smith from this commit
        run: go build -o "$HOME/.local/bin/smith" ./apps/smith
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
      - name: Audit
        run: smith ci audit
      - name: Verify
        run: smith ci verify
      # smith:slot after-verify
      - name: VS Code extension integration tests
        run: xvfb-run -a npm run test:integration -w monosmith-vscode
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci pack
      - name: Keep the packed apps (dist/drop as artifact drop)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore
      - name: Sign in to Azure
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: smith ci release
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          VSCE_AZURE_CREDENTIAL: "true"
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref_name == 'main' && hashFiles('dist/release/**') != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/release/*/*
