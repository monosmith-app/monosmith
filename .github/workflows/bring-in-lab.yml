# The bring-in lab (#1155): adopt a pinned sample repository, import the other
# samples into it, then install, build, test, lint and run smith doctor on each.
# A failure passes only when smith's "Left to do" list names it, or when
# tools/bring-in-lab/known-failing.tsv lists it with an open issue.
#
# Hand-written (not generated by the overlay), so `smith upgrade` leaves it
# alone. It clones six repositories and installs three ecosystems, so it runs
# once a week and on demand (Actions, bring-in-lab, Run workflow), not on every
# pull request. See docs/contributing/bring-in-lab.md.
name: bring-in-lab

on:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bring-in-lab
  cancel-in-progress: false

jobs:
  lab:
    name: bring-in lab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --quiet uv
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # The lab tests the smith of this commit, not a released one.
      - name: Build smith
        run: |
          go build -o "$RUNNER_TEMP/bin/smith" ./apps/smith
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Adopt and import the sample repositories
        env:
          SMITH: smith
        run: bash tools/bring-in-lab/run.sh "$RUNNER_TEMP/lab"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bring-in-lab-logs
          path: ${{ runner.temp }}/lab/logs
          if-no-files-found: ignore
