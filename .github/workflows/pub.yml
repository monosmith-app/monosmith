# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: pub

on:
  workflow_dispatch:
    inputs:
      project:
        description: The released app to publish
        required: true
      version:
        description: Its released version
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dart-lang/setup-dart@v1
      - name: Install smith
        run: curl -fsSL https://raw.githubusercontent.com/monosmith-app/monosmith/main/install.sh | sh -s -- "$SMITH_VERSION"
        env:
          SMITH_VERSION: 1.52.1
          GITHUB_TOKEN: ${{ github.token }}
      # smith:slot before-publish
      # smith:slot-end before-publish
      - name: Publish to pub.dev
        run: smith release pub --project "$PROJECT" --version "$VERSION"
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
