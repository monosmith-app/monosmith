# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: pub

on:
  workflow_dispatch:
    inputs:
      project:
        description: The released app to publish
        required: true
      version:
        description: Its released version
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: false
      - name: Install gradle
        shell: bash
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.8.1-bin.zip
          unzip -q -o -d "$HOME" /tmp/gradle.zip && rm /tmp/gradle.zip
          export PATH="$HOME/gradle-9.8.1/bin:$PATH"
          if [ -n "$GITHUB_PATH" ]; then echo "$HOME/gradle-9.8.1/bin" >> "$GITHUB_PATH"; fi
          echo "##vso[task.prependpath]$HOME/gradle-9.8.1/bin"
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dart-lang/setup-dart@v1
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith
          smith --version
      # smith:slot before-publish
      # This repository is smith: publish with the smith built from this commit, which reads its smith.toml.
      - name: Build smith from this commit
        run: |
          go build -o "$HOME/.local/bin/smith" ./apps/smith
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          smith --version
      # smith:slot-end before-publish
      - name: Publish to pub.dev
        run: smith release pub --project "$PROJECT" --version "$VERSION"
        env:
          PROJECT: ${{ inputs.project }}
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
