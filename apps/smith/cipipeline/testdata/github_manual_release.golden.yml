# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

run-name: ${{ inputs.release_bump != '' && format('ci · manual release {0}', inputs.release_bump) || github.event.pull_request.title || 'ci' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_tag:
        description: "Run only the assets job again for this release tag (project@version), from this branch"
        required: false
        default: ""
      assets_source:
        description: "With assets_tag: the code to build. current = the code of this branch as it is now, named with the tag's version (a fix reaches the files, but they carry newer code under an old number). tag = the tag's own commit, the exact code that was released. ask me (refuses) = the run stops and names both choices; it is preselected so that nothing is built from code you did not pick"
        type: choice
        required: true
        default: "ask me (refuses)"
        options:
          - current
          - tag
          - "ask me (refuses)"
      release_bump:
        description: "Release by hand a package no commit releases, as project=patch|minor|major (several: separate with commas). This publishes to the registries, tags HEAD and cannot be undone. Empty: no manual release"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    if: ${{ inputs.assets_tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install go
        shell: bash
        run: |
          curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xz
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
      - name: Install node
        shell: bash
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y -qq nodejs
      - name: Install python
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
      # smith: no plugin says how to install rust 1.90 here; add a step in the before-setup slot
      - name: Cache the go download store
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: smith-go-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'libs/core/go.sum') }}
          restore-keys: |
            smith-go-${{ runner.os }}-
      - name: Cache the npm download store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: smith-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            smith-npm-${{ runner.os }}-
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith@1.4.0
          smith --version
      # smith:slot before-setup
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
      - name: Audit
        run: smith ci audit
      - name: Verify
        run: smith ci verify
      # smith:slot after-verify
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        run: smith ci pack
      - name: Keep the packed apps (dist/drop as artifact drop)
        uses: actions/upload-artifact@v7
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore
      - name: Release
        id: release
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        run: |
          if [ -n "$RELEASE_BUMP" ]; then
            smith ci release --bump "$RELEASE_BUMP" --force
          else
            smith ci release
          fi
        env:
          RELEASE_BUMP: ${{ inputs.release_bump }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  native:
    needs: ci
    if: ${{ always() && ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main' && needs.ci.outputs.released == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install go
        shell: bash
        run: |
          curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xz
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
      - name: Install node
        shell: bash
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y -qq nodejs
      - name: Install python
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
      # smith: no plugin says how to install rust 1.90 here; add a step in the before-setup slot
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith@1.4.0
          smith --version
      - name: Setup
        run: smith ci setup
      - name: Native
        run: smith ci native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the native builds (dist/drop as artifact native-OS)
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: dist/drop
          if-no-files-found: ignore

  assets:
    needs: ci
    if: ${{ always() && ((needs.ci.outputs.released == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.assets_tag != '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install go
        shell: bash
        run: |
          curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xz
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
      - name: Install node
        shell: bash
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y -qq nodejs
      - name: Install python
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
      # smith: no plugin says how to install rust 1.90 here; add a step in the before-setup slot
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith@1.4.0
          smith --version
      - name: Setup
        run: smith ci setup --assets
      - name: Build and upload the release files
        run: smith ci assets --tag "$ASSETS_TAG" --source "$ASSETS_SOURCE"
        env:
          ASSETS_TAG: ${{ inputs.assets_tag }}
          ASSETS_SOURCE: ${{ inputs.assets_source }}
          SMITH_PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
