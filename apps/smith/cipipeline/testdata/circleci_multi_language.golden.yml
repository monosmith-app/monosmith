# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.

version: 2.1

executors:
  smith:
    docker:
      - image: debian:bookworm

commands:
  install-tools:
    description: Check out the code, install the toolchains and smith
    steps:
      - run:
          name: Install system packages
          command: apt-get update -qq && apt-get install -y -qq curl git openssh-client ca-certificates xz-utils >/dev/null
      - checkout
      - run:
          name: Install go
          command: |
            export -p | sort > /tmp/smith-env-before
            curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xz
            export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
            export -p | sort > /tmp/smith-env-after
            { comm -13 /tmp/smith-env-before /tmp/smith-env-after | grep -Ev '^declare -x (_|PWD|OLDPWD|SHLVL)=' || true; } >> "$BASH_ENV"
      - run:
          name: Install node
          command: |
            export -p | sort > /tmp/smith-env-before
            curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
            apt-get install -y -qq nodejs
            export -p | sort > /tmp/smith-env-after
            { comm -13 /tmp/smith-env-before /tmp/smith-env-after | grep -Ev '^declare -x (_|PWD|OLDPWD|SHLVL)=' || true; } >> "$BASH_ENV"
      - run:
          name: Install python
          command: |
            export -p | sort > /tmp/smith-env-before
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            export -p | sort > /tmp/smith-env-after
            { comm -13 /tmp/smith-env-before /tmp/smith-env-after | grep -Ev '^declare -x (_|PWD|OLDPWD|SHLVL)=' || true; } >> "$BASH_ENV"
      # smith: no plugin says how to install rust 1.90 here; add a step in the before-setup slot
      - run:
          name: Hash the go lockfiles
          command: cat apps/api/go.sum libs/core/go.sum > /tmp/smith-go.lock 2>/dev/null || true
      - restore_cache:
          name: Restore the go download store
          keys:
            - smith-go-v1-{{ arch }}-{{ checksum "/tmp/smith-go.lock" }}
            - smith-go-v1-{{ arch }}-
      - run:
          name: Hash the npm lockfiles
          command: cat package-lock.json > /tmp/smith-npm.lock 2>/dev/null || true
      - restore_cache:
          name: Restore the npm download store
          keys:
            - smith-npm-v1-{{ arch }}-{{ checksum "/tmp/smith-npm.lock" }}
            - smith-npm-v1-{{ arch }}-
      - run:
          name: Install smith
          command: |
            npm install --global --registry https://registry.npmjs.org/ monosmith@1.4.0
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
  save-stores:
    description: Keep the package download stores for the next run
    steps:
      - save_cache:
          name: Cache the go download store
          key: smith-go-v1-{{ arch }}-{{ checksum "/tmp/smith-go.lock" }}
          paths:
            - ~/go/pkg/mod
      - save_cache:
          name: Cache the npm download store
          key: smith-npm-v1-{{ arch }}-{{ checksum "/tmp/smith-npm.lock" }}
          paths:
            - ~/.npm

jobs:
  ci:
    executor: smith
    steps:
      - install-tools
      # smith:slot before-setup
      # smith:slot-end before-setup
      - run:
          name: Setup
          command: 'smith ci setup'
      - run:
          name: Audit
          command: 'smith ci audit'
      - run:
          name: Verify
          command: 'smith ci verify'
      # smith:slot after-verify
      # smith:slot-end after-verify
      - save-stores
      # The release preview comments on the pull request when the repository is on GitHub (GITHUB_TOKEN with
      # pull-requests: write); on Bitbucket or elsewhere it stays in this job's log.
      - run:
          name: Release preview
          command: 'if [ -n "$CIRCLE_PULL_REQUEST" ]; then smith release --dry-run --comment; fi'
      - when:
          condition:
            equal: [ main, << pipeline.git.branch >> ]
          steps:
            - run:
                name: Pack
                command: 'smith ci pack'
            - store_artifacts:
                path: dist/drop
                destination: drop
            # Releasing pushes tags: the checkout key is read-only, so add a user key with write access
            # (Project Settings > SSH Keys > Add user key) for it to push with.
            - run:
                name: Release
                command: 'smith ci release'

  # Not built on CircleCI: windows-latest, macos-latest. The toolchains install with Debian commands, so this job
  # builds on Linux only; add a job with a macOS or Windows executor that runs `smith ci native`.
  native:
    executor: smith
    steps:
      - install-tools
      - run:
          name: Setup
          command: 'smith ci setup'
      - run:
          name: Native
          command: 'smith ci native'
      - store_artifacts:
          path: dist/drop
          destination: native-linux

workflows:
  ci:
    jobs:
      - ci
      - native:
          requires: [ci]

# Secrets the release reads, as project environment variables (or in a context):
#   NODE_AUTH_TOKEN: publishes npm packages
#   PYPI_TOKEN: publishes to PyPI
