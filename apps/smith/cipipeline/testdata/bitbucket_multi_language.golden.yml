# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.

image: debian:bookworm

clone:
  depth: full

definitions:
  caches:
    go:
      key:
        files:
          - "apps/api/go.sum"
          - "libs/core/go.sum"
      path: ~/go/pkg/mod
    npm:
      key:
        files:
          - package-lock.json
      path: ~/.npm
  steps:
    - step: &ci
        name: Verify
        caches: [go, npm]
        script:
          - apt-get update -qq && apt-get install -y -qq curl git ca-certificates xz-utils >/dev/null
          # go 1.26
          - 'curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xz'
          - 'export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH'
          # node 24
          - 'curl -fsSL https://deb.nodesource.com/setup_24.x | bash -'
          - 'apt-get install -y -qq nodejs'
          # python 3.12
          - 'curl -LsSf https://astral.sh/uv/install.sh | sh'
          - 'export PATH="$HOME/.local/bin:$PATH"'
          # smith: no plugin says how to install rust 1.90 here; add a step in the before-setup slot
          - 'npm install --global --registry https://registry.npmjs.org/ monosmith@1.4.0'
          - 'export PATH="$HOME/.local/bin:$PATH"'
          # smith:slot before-setup
          # smith:slot-end before-setup
          - smith ci setup
          - smith ci audit
          - smith ci verify
          # smith:slot after-verify
          # smith:slot-end after-verify
          # The release preview comments on the pull request with BITBUCKET_TOKEN (a repository access token
          # with pull request write).
          - 'if [ -n "$BITBUCKET_PR_ID" ]; then smith release --dry-run --comment; fi'
          - 'if [ -z "$BITBUCKET_PR_ID" ] && [ "$BITBUCKET_BRANCH" = "main" ]; then smith ci pack; fi'
          # Releasing pushes tags: BITBUCKET_TOKEN needs repository write.
          - 'if [ -z "$BITBUCKET_PR_ID" ] && [ "$BITBUCKET_BRANCH" = "main" ]; then git remote set-url origin "https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}.git"; smith ci release; fi'
        artifacts:
          - dist/drop/**
    # Not built on Bitbucket: windows-latest, macos-latest. The cloud runs Linux; add a step with `runs-on: [self.hosted, ...]`
    # on a self-hosted macOS or Windows runner that runs `smith ci native`.
    - step: &native
        name: Native (Linux)
        caches: [go, npm]
        script:
          - apt-get update -qq && apt-get install -y -qq curl git ca-certificates xz-utils >/dev/null
          # go 1.26
          - 'curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz | tar -C /usr/local -xz'
          - 'export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH'
          # node 24
          - 'curl -fsSL https://deb.nodesource.com/setup_24.x | bash -'
          - 'apt-get install -y -qq nodejs'
          # python 3.12
          - 'curl -LsSf https://astral.sh/uv/install.sh | sh'
          - 'export PATH="$HOME/.local/bin:$PATH"'
          # smith: no plugin says how to install rust 1.90 here; add a step in the before-setup slot
          - 'npm install --global --registry https://registry.npmjs.org/ monosmith@1.4.0'
          - 'export PATH="$HOME/.local/bin:$PATH"'
          - smith ci setup
          - smith ci native
        artifacts:
          - dist/drop/**

pipelines:
  pull-requests:
    '**':
      - step: *ci
      - step: *native
  branches:
    main:
      - step: *ci
      - step: *native

# Secrets the release reads, as secured repository or workspace variables:
#   NODE_AUTH_TOKEN: publishes npm packages
#   PYPI_TOKEN: publishes to PyPI
