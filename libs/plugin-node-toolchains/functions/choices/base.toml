# What every choice of the functions plugin builds on: the package, the TypeScript
# configuration and the greeting slice of a function app. A host adds its entry point and its
# local tool files; a trigger and a runtime set slots. The plugin writes the build, start and
# package tasks (functionhost.AssembleTask, StartTask, PackageTask): they run smith's own
# commands and the host's tool, so no script is copied into the app.
#
# Slots read here:
#   trigger       the kind of event the function answers: http, timer, queue or blob (one item)
#   node.major    the Node.js major version of the runtime (one item)
#   main          the package.json "main" (a host sets it when its tool reads it)
dev_dependencies = ["typescript", "@types/node", "@monosmith/tsconfig"]

[tasks]
typecheck = "tsc -p tsconfig.json --noEmit"

[files]
"package.json" = '''
{
  "name": "[[.Package]]",
  "version": "0.0.0",
  "private": true,
  "type": "module",
  "smith": { "kind": "app"[[if .Stack]], "stack": "[[.Stack]]"[[end]] },[[if index .Slots "main"]]
  "main": "[[index .Slots "main" 0]]",[[end]]
  "engines": { "node": ">=[[index .Slots "node.major" 0]]" },
  "scripts": {
[[- range $i, $s := .Scripts]][[if $i]],[[end]]
    "[[$s.Name]]": "[[$s.Value]]"[[end]]
  }[[if .Dependencies]],
  "dependencies": {
[[- range $i, $d := .Dependencies]][[if $i]],[[end]]
    "[[$d.Name]]": "[[$d.Value]]"[[end]]
  }[[end]]
}
'''

# The tests are compiled by the type check and left out of the build.
"tsconfig.json" = '''
{
  "extends": "[[.Up]]tsconfig.base.json",
  "compilerOptions": {
    "rootDir": "src",
    "types": ["node"[[range index .Slots "tsconfig.types"]], "[[.]]"[[end]]]
  },
  "include": ["src"]
}
'''

"tsconfig.build.json" = '''
{
  "extends": "./tsconfig.json",
  "compilerOptions": { "outDir": "[[.Build]]/dist" },
  "exclude": ["src/**/*.[[.TestSuffix]].ts"]
}
'''
