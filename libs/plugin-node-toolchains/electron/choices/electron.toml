axis = "framework"
name = "electron"
description = "an Electron desktop app in TypeScript: a main process, a preload script that uses contextBridge, and one renderer page; start opens the window, package makes the app folder with Electron Forge"
title = "Electron"
aliases = ["desktop", "windows", "mac", "linux", "native", "app", "chromium"]
layer = "shell"
language = "node"
roles = ["scaffold"]
needs = ["lint", "test"]
conflicts = ["jest", "azure-functions", "aws-lambda", "gcp-functions", "tauri"]
dev_dependencies = ["electron", "@electron-forge/cli"]

[slots]
main = ["dist/main/app.handler.js"]

[files]
"src/main/app.handler.ts" = '''
import { app, BrowserWindow, ipcMain } from 'electron'
import { dirname, join } from 'node:path'
import { fileURLToPath } from 'node:url'
import { greet } from '../greeting/index.ts'
import { windowOptions } from './window-options.config.ts'

const here = dirname(fileURLToPath(import.meta.url))

/** Opens the app window on the renderer page. */
function createWindow (): void {
  const window = new BrowserWindow(windowOptions(join(here, '..', 'preload', 'bridge.handler.cjs')))
  void window.loadFile(join(here, '..', 'renderer', 'index.html'))
}

ipcMain.handle('greet', (_event, name: unknown) => greet(typeof name === 'string' ? name : 'world'))

void app.whenReady().then(() => {
  createWindow()
  app.on('activate', () => {
    if (BrowserWindow.getAllWindows().length === 0) createWindow()
  })
})

app.on('window-all-closed', () => {
  if (process.platform !== 'darwin') app.quit()
})
'''

"src/main/window-options.config.ts" = '''
import type { BrowserWindowConstructorOptions } from 'electron'

/**
 * The options of the app window. The page gets no Node.js: it talks to the main process only
 * through what the preload script exposes.
 * @param preload - the path of the compiled preload script
 * @returns the options for new BrowserWindow
 */
export function windowOptions (preload: string): BrowserWindowConstructorOptions {
  return {
    width:          800,
    height:         600,
    webPreferences: { preload, contextIsolation: true, nodeIntegration: false, sandbox: true },
  }
}
'''

"src/main/window-options.config.[[.TestSuffix]].ts" = '''
import { describe, expect, it } from 'vitest'
import { windowOptions } from './window-options.config.ts'

describe('windowOptions', () => {
  it('keeps the page away from Node.js', () => {
    const { webPreferences } = windowOptions('preload.cjs')
    expect(webPreferences).toMatchObject({ contextIsolation: true, nodeIntegration: false, sandbox: true })
  })

  it('loads the given preload script', () => {
    expect(windowOptions('preload.cjs').webPreferences?.preload).toBe('preload.cjs')
  })
})
'''

# A sandboxed preload script cannot be a module, so it is a .cts file: it builds to .cjs.
"src/preload/bridge.handler.cts" = '''
import { contextBridge, ipcRenderer } from 'electron'
import type { Api } from './api.contract.ts'

const api: Api = {
  greet: async (name) => await ipcRenderer.invoke('greet', name),
}

contextBridge.exposeInMainWorld('api', api)
'''

"src/preload/index.ts" = '''
export type { Api } from './api.contract.ts'
'''

"src/preload/api.contract.ts" = '''
import type { Greeting } from '../greeting/index.ts'

/** What the page may ask of the main process: nothing else is exposed. */
export interface Api {
  greet: (name: string) => Promise<Greeting>
}
'''

"src/renderer/page.handler.ts" = '''
import type { Api } from '../preload/index.ts'

// The preload script exposes the api on the page's global object.
const { api } = globalThis as unknown as { api: Api }
const name = document.getElementById('name') as HTMLInputElement | null
const output = document.getElementById('greeting')

document.getElementById('go')?.addEventListener('click', () => {
  void api.greet(name?.value ?? '').then((greeting) => {
    if (output !== null) output.textContent = greeting.message
  })
})
'''

# The page allows only its own scripts: no inline script, no remote code.
"src/renderer/index.html" = '''
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>[[.Name]]</title>
  </head>
  <body>
    <h1>[[.Name]]</h1>
    <input id="name" value="world" />
    <button id="go" type="button">Greet</button>
    <p id="greeting"></p>
    <script type="module" src="./page.handler.js"></script>
  </body>
</html>
'''
